<!DOCTYPE html>
<html>
<head>
    <title>Typst Template PDF Viewer</title>
    <style>
        body { margin: 0; padding: 20px; font-family: Arial; }
        h1 { color: #333; }
        .container { max-width: 1200px; margin: 0 auto; }
        embed { border: 1px solid #ccc; }
    </style>
</head>
<body>
    <div class="container">
        <h1>Typst Template Output</h1>
        <p>Persian RTL Document Template - Converted from LaTeX</p>
        <embed src="main.pdf" type="application/pdf" width="100%" height="800px" />
    </div>
</body>
</html>
